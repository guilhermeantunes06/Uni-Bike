openapi: 3.0.3
info:
  title: Uni-Bike API
  version: 0.1.0
  description: >
    Contrato da interface de serviços REST do sistema Uni-Bike para o 1.º incremento (Épico 1).
    Mapeia os fluxos dos slices UC-07.S1, UC-01.S1, UC-04.S1, UC-06.S1 e UC-08.S1.

paths:
  /api/health:
    get:
      summary: Verifica o estado do sistema e ligação à base de dados
      tags:
        - system
      responses:
        '200':
          description: Sistema operacional

  /api/auth/sso/login:
    post:
      summary: Autenticação institucional federada (UC-07.S1)
      description: Valida o token/credencial institucional SSO e emite o token de sessão JWT (BR-02, RNF-06).
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  example: aluno@ua.pt
      responses:
        '200':
          description: Autenticação bem-sucedida com token JWT
        '403':
          description: Organização inativa ou domínio não autorizado

  /api/auth/me:
    get:
      summary: Obtém perfil e estado da conta do utilizador autenticado (UC-07.S1)
      tags:
        - auth
      responses:
        '200':
          description: Perfil e elegibilidade do utilizador
        '401':
          description: Sessão inválida ou expirada

  /api/docas:
    get:
      summary: Lista as docas oficiais com coordenadas GPS, capacidade e e-bikes disponíveis (UC-01.S1)
      tags:
        - docas
      responses:
        '200':
          description: Lista de docas oficiais

  /api/ebikes:
    get:
      summary: Consulta a frota e o estado operacional/bateria de cada bicicleta (UC-06.S1)
      tags:
        - ebikes
      responses:
        '200':
          description: Lista de e-bikes registadas

  /api/viagens/unlock:
    post:
      summary: Destrancar e-bike por QR Code e iniciar viagem (UC-01.S1)
      description: >
        Valida elegibilidade (BR-02), horário de funcionamento (BR-01), bateria > 20% (BR-05)
        e ausência de viagem concorrente (BR-06), destranca a e-bike via adaptador IoT e inicia a viagem.
      tags:
        - viagens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [utilizador_id, qr_code]
              properties:
                utilizador_id:
                  type: string
                qr_code:
                  type: string
      responses:
        '201':
          description: e-Bike destrancada e viagem iniciada
        '400':
          description: Regra de negócio violada (bateria <= 20%, fora de horário, utilizador com viagem ativa ou bicicleta indisponível)

  /api/viagens/ativa:
    get:
      summary: Obtém os dados em tempo real da viagem em curso do utilizador autenticado (UC-04.S1)
      tags:
        - viagens
      responses:
        '200':
          description: Dados da viagem ativa
        '404':
          description: Utilizador sem viagem ativa no momento

  /api/viagens/{id}/lock:
    post:
      summary: Encerrar viagem e trancar e-bike em doca oficial (UC-04.S1)
      description: Valida estacionamento na doca via geofence (BR-04), bloqueia a tranca e calcula distância e CO2 poupado (BR-03).
      tags:
        - viagens
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [doca_destino_id, latitude, longitude]
              properties:
                doca_destino_id:
                  type: string
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: Viagem encerrada com sucesso
        '400':
          description: Bicicleta fora do geofence da doca oficial

  /api/telemetria:
    post:
      summary: Receber pacotes de telemetria IoT da e-bike (UC-06.S1)
      description: Atualiza coordenadas GPS, percentagem de bateria, heartbeat e gera alerta se bateria < 15% (BR-05).
      tags:
        - telemetria
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ebike_id, bateria_pct, latitude, longitude]
              properties:
                ebike_id:
                  type: string
                bateria_pct:
                  type: integer
                latitude:
                  type: number
                longitude:
                  type: number
      responses:
        '200':
          description: Telemetria processada

  /api/telemetria/live:
    get:
      summary: Fornece os últimos registos de posição e carga da frota para a consola operacional (UC-06.S1)
      tags:
        - telemetria
      responses:
        '200':
          description: Estado atualizado da frota e alertas de bateria/conectividade

  /api/esg/dashboard:
    get:
      summary: Consultar métricas ESG agregadas da organização (UC-08.S1)
      description: Calcula e devolve indicadores anónimos de km percorridos e CO2 evitado por período (BR-03).
      tags:
        - esg
      parameters:
        - name: organizacao_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Indicadores ESG consolidados

  /api/esg/export:
    get:
      summary: Exportar relatório consolidado de sustentabilidade em PDF ou CSV (UC-08.S1)
      tags:
        - esg
      parameters:
        - name: organizacao_id
          in: query
          required: true
          schema:
            type: string
        - name: formato
          in: query
          required: false
          schema:
            type: string
            enum: [pdf, csv]
            default: csv
      responses:
        '200':
          description: Ficheiro de relatório gerado em < 5s (RNF-04)

  /api/test/reset:
    post:
      summary: Repõe a base de dados SQLite para o estado inicial antes dos testes Playwright (RT-01)
      description: Disponível apenas em ambiente de teste para garantir determinismo E2E.
      tags:
        - test-utils
      responses:
        '200':
          description: Base de dados reposta para o estado inicial
